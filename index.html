<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Холст</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#1e1f22;--s:#2b2d31;--s2:#313338;--bd:#3f4147;--tx:#e6e6e8;--mu:#9a9ca3;--bl:#2e88f7;--pk:#e5456a;--gr:#13d679;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
body{display:flex;flex-direction:column;height:100vh}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:24px;background:#1a1b1e}
.wrap{position:relative;width:min(82vh,100%);aspect-ratio:1;background:#111214;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.wrap.drag{cursor:grabbing}
.wrap.empty{cursor:pointer;border:2px dashed var(--bd)}
.wrap.empty::before{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(45deg,#1c1d20,#1c1d20 12px,#202226 12px,#202226 24px)}
.wrap:not(.empty)::before{display:none}
.hint{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mu);font-size:13px;text-align:center;pointer-events:none}
.hint i{width:34px;height:34px}
.wrap:not(.empty) .hint{display:none}
#cv{display:block;width:100%;height:100%;position:absolute;inset:0;z-index:1;pointer-events:none}

.panel{flex:0 0 auto;background:#25272b;border-top:1px solid var(--bd);padding:10px 14px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.ctl{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:6px 10px;display:flex;align-items:center;flex:0 1 240px;min-width:190px}
.row{display:flex;align-items:center;gap:6px;width:100%}
.ib{width:24px;height:24px;padding:0;border:1px solid var(--bd);background:var(--s2);color:var(--tx);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ib:hover{background:#3a3d44}
.ib i{width:13px;height:13px}
input[type=range]{flex:1;min-width:80px;height:4px;cursor:pointer;accent-color:var(--bl)}
.val{min-width:56px;text-align:right;font-size:11px;color:var(--mu);cursor:pointer;border-radius:4px;padding:2px 4px}
.val:hover{background:var(--s2);color:var(--tx)}
.bg{flex:0 1 300px}
.pw{position:relative;display:inline-flex;align-items:center;gap:8px;flex:1}
.sw{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);cursor:pointer;flex:0 0 auto;background:#111214}
.hex{flex:1;min-width:0;background:none;border:none;color:var(--tx);font:12px ui-monospace,monospace;outline:none;padding:4px 2px;text-transform:uppercase}
#ci{position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:0;padding:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:36px;border:none;border-radius:var(--r);font:600 12px inherit;color:#fff;cursor:pointer;white-space:nowrap}
.btn i{width:14px;height:14px}
.u{background:var(--bl)}.u:hover{background:#1e74e0}
.d{background:var(--gr)}.d:hover{background:#0fbb69}
.d:disabled{background:#4a4d54;color:#888b92;cursor:not-allowed}
.r{background:var(--pk)}.r:hover{background:#cf3459}
.sh{background:#7c5cff}.sh:hover{background:#6a4be0}
#fi{display:none}
.combo-inputs{display:flex;flex:1 1 100%;gap:8px;flex-wrap:wrap;margin-top:8px}
.combo-inputs input{
  flex:1 1 200px;
  height:40px;
  background:var(--s2);
  border:1px solid var(--bd);
  color:var(--tx);
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  outline:none;
  transition:border-color .15s;
}
.combo-inputs input:focus{border-color:var(--bl)}

/* Чекбокс «Улучшить резкость» */
.sharpen-wrap{
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:36px;
  padding:0 12px;
  background:var(--s);
  border:1px solid var(--bd);
  border-radius:var(--r);
  font-size:12px;
  color:var(--tx);
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
.sharpen-wrap input{accent-color:var(--bl);cursor:pointer;width:16px;height:16px}
.sharpen-wrap.disabled{opacity:.5;pointer-events:none}

@media(max-width:760px){.stage{padding:12px}.wrap{width:min(70vh,100%)}.panel{padding:8px 8px 16px;gap:6px}.ctl{flex:1 1 100%;min-width:0}.btn{flex:1 1 auto;justify-content:center}}
</style>
</head>
<body>
<div class="stage">
  <div class="wrap empty" id="wrap">
    <canvas id="cv"></canvas>
    <div class="hint"><i data-lucide="image-plus"></i><span>Нажмите или перетащите картинку</span></div>
  </div>
</div>

<div class="panel">
  <div class="ctl"><div class="row">
    <button class="ib" data-t="sc" data-s="-1"><i data-lucide="minus"></i></button>
    <input type="range" id="sc" min="5" max="400" value="100" step="0.1">
    <button class="ib" data-t="sc" data-s="1"><i data-lucide="plus"></i></button>
    <span class="val" id="scV">100.0%</span>
  </div></div>

  <div class="ctl"><div class="row">
    <button class="ib" data-t="fs" data-s="-0.5"><i data-lucide="minus"></i></button>
    <input type="range" id="fs" min="6" max="96" value="16" step="0.1">
    <button class="ib" data-t="fs" data-s="0.5"><i data-lucide="plus"></i></button>
    <span class="val" id="fsV">16.0px</span>
  </div></div>

  <div class="ctl bg"><div class="row">
    <div class="pw">
      <button class="sw" id="sw" title="Цвет фона"></button>
      <input type="color" id="ci" value="#111214">
      <input class="hex" id="hx" value="#111214" maxlength="7" spellcheck="false">
      <button class="ib" id="pick" title="Пипетка — выбрать цвет с экрана">
        <i data-lucide="pipette"></i>
      </button>
    </div>
  </div></div>

  <div class="combo-inputs">
    <input type="text" id="cbIn1" placeholder="Текст темной плашки">
  </div>

  <div class="acts">
    <input type="file" id="fi" accept="image/*">
    <label for="fi" class="btn u"><i data-lucide="upload"></i>Загрузить фон</label>

    <label class="sharpen-wrap" id="sharpenWrap" title="Unsharp Mask — применяется только при сохранении">
      <input type="checkbox" id="sharpenToggle">
      <i data-lucide="sparkles" style="width:14px;height:14px"></i>
      Улучшить резкость
    </label>

    <button id="sh" class="btn sh"><i data-lucide="share-2"></i>Поделиться</button>
    <button id="dl" class="btn d" disabled><i data-lucide="download"></i>Скачать</button>
    <button id="rs" class="btn r"><i data-lucide="rotate-ccw"></i>Сбросить</button>
  </div>
</div>

<script>
lucide.createIcons();
const $=id=>document.getElementById(id);
const wrap=$('wrap'), cvEl=$('cv');
const sc=$('sc'),scV=$('scV'),fs=$('fs'),fsV=$('fsV');
const ci=$('ci'),hx=$('hx'),sw=$('sw');
const cbIn1=$('cbIn1');
const sharpenToggle=$('sharpenToggle');
const sharpenWrap=$('sharpenWrap');

/* ============================================================
   ЭТАЛОННАЯ ГЕОМЕТРИЯ — всё в DESIGN-координатах (1000×1000)
   ============================================================ */
const DESIGN = 1000;
const EXPORT_SIZE = 2048;
const FONT_BASE = 16;

const BANNER_FIXED = {
  borderBottom: 2 * (25/16),
  bottomHeight: 36 * (25/16),
  redPadH: 20 * (25/16),
  redGap: 10 * (25/16),
  logoFirstH: 22 * (25/16),
  logoSmallH: 16 * (25/16),
  logoLinkH:  12 * (25/16),
  logoLastH:  22 * (25/16),
  bgRed: '#dc143c',
  borderBottomColor: '#000',
};

const BANNER_TOP = {
  borderTop: 2,
  topPadV: 16,
  topPadH: 19.2,
  mainFontPx: 28.8,
  lineHeight: 1.2,
  bgTop: '#1a1c22',
  borderTopColor: '#4a5568',
  textColor: '#ffffff',
  fontFamily: "'Oswald', Arial, sans-serif",
  fontWeight: 500,
};

const DEF = { font: 16, bg: '#111214' };
const st = {
  loaded: false,
  x: 50, y: 50, scale: 1,
  bw: 0, bh: 0,
  bg: '#111214',
  text: '',
  fontPx: 16,
  sharpen: false,   // ручной режим
  sharpenAuto: true // авто-предложение
};
let currentImg = null;

/* ===== Логотипы ===== */
const BOTTOM_IMGS = [
  "https://res.cloudinary.com/dplmdnxvk/image/upload/v1793631162/zye64uci7azgtelqiftf.png",
  "https://res.cloudinary.com/dplmdnxvk/image/upload/v1793631167/tlhzy9gdtxcxxcmgi9vn.png",
  "https://res.cloudinary.com/dplmdnxvk/image/upload/v1793631164/gmxzyocecemgtxjrmmvu.png",
  "https://res.cloudinary.com/dplmdnxvk/image/upload/v1793631073/nhcxkk1zwvz0kvbpsure.png",
  "https://res.cloudinary.com/dplmdnxvk/image/upload/v1793631479/qjb5hqheltcsyl53tphz.png"
];
const bottomImgs = BOTTOM_IMGS.map(() => null);
let bottomImgsPromise = null;

async function loadBottomImages(){
  if(bottomImgsPromise) return bottomImgsPromise;
  bottomImgsPromise = (async ()=>{
    for (let i=0;i<BOTTOM_IMGS.length;i++){
      if(bottomImgs[i] && bottomImgs[i].naturalWidth) continue;
      const src = BOTTOM_IMGS[i];
      try{
        const resp = await fetch(src, {mode:'cors'});
        if(!resp.ok) throw new Error('fetch failed');
        const blob = await resp.blob();
        const dataUrl = await new Promise(res=>{
          const fr = new FileReader();
          fr.onload = ()=>res(fr.result);
          fr.readAsDataURL(blob);
        });
        const im = new Image();
        await new Promise((res, rej)=>{ im.onload=res; im.onerror=rej; im.src = dataUrl; });
        try{ await im.decode?.(); }catch(e){}
        bottomImgs[i] = im;
      }catch(e){
        try{
          const im = new Image();
          im.crossOrigin = 'anonymous';
          await new Promise((res, rej)=>{ im.onload=res; im.onerror=rej; im.src = src; });
          try{ await im.decode?.(); }catch(e){}
          bottomImgs[i] = im;
        }catch(e2){
          console.warn('Не удалось загрузить картинку для экспорта:', src);
          bottomImgs[i] = null;
        }
      }
    }
  })();
  return bottomImgsPromise;
}

/* ===== Цвет ===== */
const normHex=s=>{s=String(s||'').trim();if(!s)return null;if(s[0]!=='#')s='#'+s;if(/^#[0-9a-f]{3}$/i.test(s))s='#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];return /^#[0-9a-f]{6}$/i.test(s)?s.toLowerCase():null;};
function setBg(c,sync=true){
  const h=normHex(c)||DEF.bg;
  st.bg=h;
  if(sync){ ci.value=h; hx.value=h.toUpperCase(); sw.style.background=h; }
  schedulePaint();
}
sw.onclick=()=>ci.click();
ci.oninput=e=>setBg(e.target.value);
hx.oninput=e=>{const h=normHex(e.target.value);if(h){st.bg=h;sw.style.background=h;ci.value=h;schedulePaint();}};
hx.onblur=()=>hx.value=st.bg.toUpperCase();

/* ===== ПИПЕТКА ===== */
const pickBtn = $('pick');
if('EyeDropper' in window){
  pickBtn.onclick = async () => {
    try{
      const eyeDropper = new EyeDropper();
      const result = await eyeDropper.open();
      setBg(result.sRGBHex, true);
    }catch(err){
      if(err && err.name !== 'AbortError') console.warn(err);
    }
  };
}else{
  pickBtn.style.display = 'none';
}

/* ===== ЧЕКБОКС РЕЗКОСТИ ===== */
function setSharpenUI(){
  if(!st.loaded){
    sharpenToggle.checked = false;
    sharpenWrap.classList.add('disabled');
    return;
  }
  sharpenWrap.classList.remove('disabled');
  // Авто-решение: включаем, если картинка апскейлится (источник < EXPORT_SIZE)
  const needSharpen = Math.min(st.bw, st.bh) < EXPORT_SIZE;
  if(st.sharpenAuto && needSharpen){
    st.sharpen = true;
    sharpenToggle.checked = true;
  }else{
    sharpenToggle.checked = st.sharpen;
  }
  // Меняем подпись, если апскейл большой
  const upFactor = Math.min(EXPORT_SIZE / st.bw, EXPORT_SIZE / st.bh);
  sharpenWrap.title = upFactor > 1.5
    ? `Источник ${st.bw}×${st.bh} — сильный апскейл (×${upFactor.toFixed(1)}). Unsharp Mask сгладит артефакты.`
    : `Применить Unsharp Mask при сохранении`;
}
sharpenToggle.onchange = () => {
  st.sharpen = sharpenToggle.checked;
  st.sharpenAuto = false; // пользователь выбрал вручную
};

/* ============================================================
   UNSHARP MASK (кроссбраузерно, без ctx.filter url())
   result = original + amount * (original - blurred)
   ============================================================ */
function unsharpMask(targetCtx, srcImg, dx, dy, dw, dh, amount, radiusPx){
  if(!srcImg || !srcImg.naturalWidth) return;
  const W = Math.max(1, Math.round(dw));
  const H = Math.max(1, Math.round(dh));

  // 1) Размытая версия
  const blurred = document.createElement('canvas');
  blurred.width = W; blurred.height = H;
  const bctx = blurred.getContext('2d');
  // ctx.filter поддерживается во всех современных браузерах кроме старых Safari
  if('filter' in bctx){
    try{
      bctx.filter = `blur(${radiusPx}px)`;
      bctx.drawImage(srcImg, 0, 0, W, H);
      bctx.filter = 'none';
    }catch(e){
      bctx.drawImage(srcImg, 0, 0, W, H);
    }
  }else{
    // Fallback: без размытия — просто original, эффект будет слабее
    bctx.drawImage(srcImg, 0, 0, W, H);
  }

  // 2) Разница (original - blurred) → берём abs через difference
  const diff = document.createElement('canvas');
  diff.width = W; diff.height = H;
  const dctx = diff.getContext('2d');
  dctx.drawImage(srcImg, 0, 0, W, H);          // original
  dctx.globalCompositeOperation = 'difference';
  dctx.drawImage(blurred, 0, 0);               // |original - blurred|
  dctx.globalCompositeOperation = 'source-over';

  // 3) Рисуем оригинал в целевом месте
  targetCtx.drawImage(srcImg, dx, dy, dw, dh);

  // 4) Накладываем разницу с 'lighter' (аддитивно), с силой amount
  targetCtx.save();
  targetCtx.globalCompositeOperation = 'lighter';
  targetCtx.globalAlpha = Math.max(0, Math.min(1, amount));
  targetCtx.drawImage(diff, dx, dy, dw, dh);
  targetCtx.restore();
}

/* ============================================================
   ВЕРХНЯЯ ЧАСТЬ — зависит от ползунка шрифта
   ============================================================ */
function topMetrics(){
  const f = st.fontPx / FONT_BASE;
  return {
    f,
    borderTop:    BANNER_TOP.borderTop * f,
    topPadV:      BANNER_TOP.topPadV * f,
    topPadH:      BANNER_TOP.topPadH * f,
    mainFontPx:   BANNER_TOP.mainFontPx * f,
    lineHeight:   BANNER_TOP.lineHeight,
  };
}

/* ============================================================
   ПЕРЕНОС ТЕКСТА
   ============================================================ */
function layoutText(ctx, text, maxWidth){
  if(!text) return [];
  ctx.save();
  const lines = [];
  const paragraphs = text.split('\n');
  for(const para of paragraphs){
    if(para === ''){ lines.push(''); continue; }
    const words = para.split(/\s+/);
    let line = '';
    for(const word of words){
      const test = line ? (line + ' ' + word) : word;
      const w = ctx.measureText(test).width;
      if(w <= maxWidth || !line){
        line = test;
      }else{
        lines.push(line);
        line = word;
      }
    }
    if(line) lines.push(line);
  }
  ctx.restore();
  return lines;
}

/* ============================================================
   ГЛАВНАЯ ФУНКЦИЯ РИСОВАНИЯ (превью + экспорт)
   useSharpen = true только при экспорте
   ============================================================ */
async function paint(canvas, S, useSharpen = false){
  const c = canvas.getContext('2d', {alpha:false});
  const k = S / DESIGN;

  c.imageSmoothingEnabled = true;
  c.imageSmoothingQuality = 'high';

  c.fillStyle = st.bg;
  c.fillRect(0, 0, S, S);

  if(st.loaded && currentImg && currentImg.naturalWidth){
    const ratio = st.bw / st.bh;
    let fwD, fhD;
    if(ratio >= 1){ fwD = DESIGN; fhD = DESIGN / ratio; }
    else          { fhD = DESIGN; fwD = DESIGN * ratio; }
    const w = fwD * st.scale * k;
    const h = fhD * st.scale * k;
    const cx = st.x / 100 * S;
    const cy = st.y / 100 * S;
    const dx = cx - w/2;
    const dy = cy - h/2;

    c.save();
    c.beginPath();
    c.rect(0, 0, S, S);
    c.clip();

    try{
      if(useSharpen && st.sharpen){
        // Подбираем силу по степени апскейла
        const upX = w / st.bw;
        const upY = h / st.bh;
        const up = Math.max(1, (upX + upY) / 2);
        // Чем сильнее апскейл — тем сильнее шарп, но не больше 0.9
        const amount = Math.min(0.9, 0.25 + (up - 1) * 0.3);
        // Радиус ~1.2% от размера отрисовки
        const radius = Math.max(0.5, Math.min(3, w * 0.0015));
        unsharpMask(c, currentImg, dx, dy, w, h, amount, radius);
      }else{
        c.drawImage(currentImg, dx, dy, w, h);
      }
    }catch(e){
      // Fallback
      try{ c.drawImage(currentImg, dx, dy, w, h); }catch(err){}
      console.warn('drawImage main failed', e);
    }
    c.restore();
  }

  const tm = topMetrics();

  const borderTop    = tm.borderTop * k;
  const topPadV      = tm.topPadV * k;
  const topPadH      = tm.topPadH * k;
  const mainFontPx   = tm.mainFontPx * k;
  const lineHeightPx = mainFontPx * tm.lineHeight;

  const borderBottom = BANNER_FIXED.borderBottom * k;
  const bottomHeight = BANNER_FIXED.bottomHeight * k;
  const redPadH      = BANNER_FIXED.redPadH * k;
  const redGap       = BANNER_FIXED.redGap * k;
  const logoFirstH   = BANNER_FIXED.logoFirstH * k;
  const logoSmallH   = BANNER_FIXED.logoSmallH * k;
  const logoLinkH    = BANNER_FIXED.logoLinkH * k;
  const logoLastH    = BANNER_FIXED.logoLastH * k;

  c.font = `${BANNER_TOP.fontWeight} ${mainFontPx}px ${BANNER_TOP.fontFamily}`;
  const maxTextWidth = S - topPadH * 2;
  const lines = layoutText(c, st.text, maxTextWidth);
  const lineCount = Math.max(1, lines.length);
  const textBlockH = lineCount * lineHeightPx;
  const topPartH = topPadV * 2 + textBlockH;

  const bannerH = borderTop + topPartH + borderBottom + bottomHeight;
  const bannerY = S - bannerH;

  c.fillStyle = BANNER_TOP.borderTopColor;
  c.fillRect(0, bannerY, S, borderTop);

  const topPartY = bannerY + borderTop;
  c.fillStyle = BANNER_TOP.bgTop;
  c.fillRect(0, topPartY, S, topPartH);

  if(lines.length && st.text){
    c.save();
    c.fillStyle = BANNER_TOP.textColor;
    c.textBaseline = 'middle';
    c.textAlign = 'left';
    c.font = `${BANNER_TOP.fontWeight} ${mainFontPx}px ${BANNER_TOP.fontFamily}`;
    const firstLineCenterY = topPartY + topPadV + lineHeightPx / 2;
    for(let i=0;i<lines.length;i++){
      c.fillText(lines[i], topPadH, firstLineCenterY + i * lineHeightPx);
    }
    c.restore();
  }

  c.fillStyle = BANNER_FIXED.borderBottomColor;
  c.fillRect(0, topPartY + topPartH, S, borderBottom);

  const redY = topPartY + topPartH + borderBottom;
  c.fillStyle = BANNER_FIXED.bgRed;
  c.fillRect(0, redY, S, bottomHeight);

  const midY = redY + bottomHeight / 2;
  const heights = [logoFirstH, logoSmallH, logoSmallH, logoLinkH, logoLastH];
  let xPos = redPadH;
  for(let i=0;i<heights.length;i++){
    const src = bottomImgs[i];
    if(!src || !src.naturalWidth || !src.naturalHeight) continue;
    const h = heights[i];
    const w = src.naturalWidth * (h / src.naturalHeight);
    const isLast = (i === heights.length - 1);
    const drawX = isLast ? (S - redPadH - w) : xPos;
    try{ c.drawImage(src, drawX, midY - h/2, w, h); }
    catch(e){ console.warn('drawImage logo failed', i, e); }
    if(!isLast) xPos += w + redGap;
  }
}

/* ============================================================
   ПРЕВЬЮ
   ============================================================ */
let paintScheduled = false;
function schedulePaint(){
  if(paintScheduled) return;
  paintScheduled = true;
  requestAnimationFrame(async ()=>{
    paintScheduled = false;
    await renderPreview();
  });
}

let previewRendering = false;
async function renderPreview(){
  if(previewRendering) return;
  previewRendering = true;
  try{
    await ensureReady();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = wrap.getBoundingClientRect();
    const cssSize = Math.max(1, Math.round(rect.width));
    const px = Math.round(cssSize * dpr);
    if(cvEl.width !== px || cvEl.height !== px){
      cvEl.width = px;
      cvEl.height = px;
    }
    await paint(cvEl, px, false); // ← без шарпа в превью
  } finally {
    previewRendering = false;
  }
}

let readyPromise = null;
function ensureReady(){
  if(readyPromise) return readyPromise;
  readyPromise = (async ()=>{
    try{
      if(document.fonts){
        await Promise.all([
          document.fonts.load(`500 32px Oswald`),
          document.fonts.load(`700 32px Oswald`),
        ]);
        await document.fonts.ready;
      }
    }catch(e){}
    try{ await loadBottomImages(); }catch(e){}
  })();
  return readyPromise;
}

function setFont(p){
  const v = Math.max(6, Math.min(96, parseFloat(p) || FONT_BASE));
  st.fontPx = v;
  fs.value = v;
  fsV.textContent = v.toFixed(1) + 'px';
  schedulePaint();
}
fs.oninput = e => setFont(e.target.value);
fsV.onclick = () => setFont(DEF.font);

function setScale(s){
  st.scale = Math.min(4, Math.max(.05, s));
  sc.value = (st.scale * 100).toFixed(1);
  scV.textContent = (st.scale * 100).toFixed(1) + '%';
  schedulePaint();
}
sc.oninput = e => setScale(parseFloat(e.target.value) / 100);
scV.onclick = () => setScale(1);

cbIn1.oninput = () => { st.text = cbIn1.value; schedulePaint(); };

document.querySelectorAll('.ib').forEach(b=>{
  b.onclick = ()=>{
    const t = b.dataset.t, s = parseFloat(b.dataset.s);
    if(t === 'sc') setScale(st.scale + s/100);
    else setFont(st.fontPx + s);
  };
});

function loadFile(f){
  if(!f || !f.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = e => {
    const im = new Image();
    im.onload = async () => {
      try{ await im.decode?.(); }catch(err){}
      currentImg = im;
      st.bw = im.naturalWidth;
      st.bh = im.naturalHeight;
      st.loaded = true;
      st.x = 50; st.y = 50; st.scale = 1;
      sc.value = 100; scV.textContent = '100.0%';
      wrap.classList.remove('empty');
      $('dl').disabled = false;

      // Авто-включение шарпа при апскейле
      st.sharpenAuto = true;
      st.sharpen = Math.min(st.bw, st.bh) < EXPORT_SIZE;
      setSharpenUI();

      if(Math.min(st.bw, st.bh) < 1024){
        console.warn(`Изображение ${st.bw}×${st.bh} меньше 1024px по одной из сторон. Рекомендуется источник ≥ 2048px для идеальной резкости.`);
      }

      schedulePaint();
    };
    im.src = e.target.result;
  };
  rd.readAsDataURL(f);
}
$('fi').onchange = e => loadFile(e.target.files[0]);
wrap.onclick = () => { if(!st.loaded) $('fi').click(); };

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

let drag = null;
function down(x,y){ if(!st.loaded) return; drag = {px:x, py:y, x:st.x, y:st.y}; wrap.classList.add('drag'); }
function move(x,y){
  if(!drag) return;
  const rect = wrap.getBoundingClientRect();
  const w = rect.width || 1;
  st.x = drag.x + (x - drag.px) / w * 100;
  st.y = drag.y + (y - drag.py) / w * 100;
  schedulePaint();
}
function up(){ drag = null; wrap.classList.remove('drag'); }

wrap.addEventListener('mousedown', e => { if(e.button!==0) return; e.preventDefault(); down(e.clientX,e.clientY); });
addEventListener('mousemove', e => move(e.clientX,e.clientY));
addEventListener('mouseup', up);

let pinch = null;
const td = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
wrap.addEventListener('touchstart', e=>{
  if(e.touches.length===1) down(e.touches[0].clientX, e.touches[0].clientY);
  else if(e.touches.length===2) pinch = {d:td(e.touches), s:st.scale};
},{passive:true});
wrap.addEventListener('touchmove', e=>{
  if(e.touches.length===1 && drag){ e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }
  else if(e.touches.length===2 && pinch){ e.preventDefault(); setScale(pinch.s * td(e.touches)/pinch.d); }
},{passive:false});
wrap.addEventListener('touchend', e=>{
  if(e.touches.length===0){ up(); pinch=null; }
  else if(e.touches.length===1 && pinch){ pinch=null; down(e.touches[0].clientX, e.touches[0].clientY); }
});
wrap.addEventListener('wheel', e=>{
  if(!st.loaded) return;
  e.preventDefault();
  setScale(st.scale * (1 - e.deltaY * .0015));
},{passive:false});
