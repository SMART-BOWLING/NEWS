<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS кнопка — настройка текста и цвета</title>
  <style>
    /* Базовые стили, соответствующие тёмной теме родительской страницы */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1b1e;
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    /* Контейнер-демо, имитирует правый нижний угол */
    .demo-wrapper {
      position: relative;
      width: 360px;
      height: 240px;
      background: #111214;
      border-radius: 10px;
      border: 1px solid #3f4147;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 16px;
    }

    /* 
      Кнопка NEWS — полностью кастомизируемая.
      Меняйте текст внутри span и цвет фона через переменную --bg-color.
    */
    .news-button {
      --bg-color: #dc143c;          /* цвет подложки — меняйте здесь */
      --text-color: #ffffff;        /* цвет текста — меняйте здесь */
      
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: none;
      border-radius: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font: 600 14px 'Oswald', Arial, sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      user-select: none;
      white-space: nowrap;
    }

    .news-button:hover {
      filter: brightness(1.15);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    .news-button:active {
      transform: scale(0.96);
    }

    /* 
      Дополнительные примеры кнопок с разными цветами и текстом,
      чтобы показать гибкость настройки.
    */
    .news-button.sport {
      --bg-color: #13d679;
      --text-color: #111214;
    }

    .news-button.tech {
      --bg-color: #2e88f7;
      --text-color: #ffffff;
    }

    .news-button.opinion {
      --bg-color: #7c5cff;
      --text-color: #ffffff;
    }

    .news-button.warning {
      --bg-color: #f7a52e;
      --text-color: #111214;
    }

    /* Подпись под кнопкой (для демонстрации) */
    .caption {
      position: absolute;
      left: 16px;
      top: 16px;
      color: #9a9ca3;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="demo-wrapper">
    <!-- Подпись для наглядности -->
    <span class="caption">меняйте текст и --bg-color</span>

    <!-- 
      Сама кнопка NEWS.
      • Текст: внутри <span> — можно заменить на любой.
      • Цвет: переменная --bg-color в стиле .news-button.
      • Цвет текста: --text-color.
    -->
    <button class="news-button" id="newsButton">
      <span id="newsText">NEWS</span>
    </button>
  </div>

  <!-- Небольшой скрипт для демонстрации динамического изменения текста и цвета -->
  <script>
    (function() {
      const btn = document.getElementById('newsButton');
      const textSpan = document.getElementById('newsText');

      // Пример: через 3 секунды меняем текст и цвет
      // (раскомментируйте, если хотите увидеть динамику)
      /*
      setTimeout(() => {
        textSpan.textContent = 'СРОЧНО';
        btn.style.setProperty('--bg-color', '#e5456a');
      }, 3000);
      */

      // Ручное управление — можно раскомментировать для интерактивности:
      // btn.addEventListener('click', () => {
      //   const texts = ['NEWS', 'СРОЧНО', 'ЭКСКЛЮЗИВ', 'ГЛАВНОЕ'];
      //   const colors = ['#dc143c', '#e5456a', '#2e88f7', '#13d679', '#7c5cff'];
      //   const i = Math.floor(Math.random() * texts.length);
      //   textSpan.textContent = texts[i];
      //   btn.style.setProperty('--bg-color', colors[Math.floor(Math.random() * colors.length)]);
      // });
    })();
  </script>

  <!-- 
    ПРИМЕЧАНИЕ:
    В родительском коде (из вашего вопроса) кнопка "NEWS" находится 
    в правом нижнем углу баннера, который рисуется на canvas.
    Эта HTML/CSS-кнопка — отдельный элемент, который можно использовать 
    как замену или как оверлей поверх canvas, если нужно менять текст 
    и цвет без перерисовки холста.

    Чтобы интегрировать в основной проект:
    1. Добавьте .news-button (и его стили) в <style> основной страницы.
    2. Разместите <button class="news-button">...</button> внутри .wrap 
       (или поверх него) с position: absolute; right: 10px; bottom: 10px; z-index: 10.
    3. Меняйте textContent и style.setProperty('--bg-color', '#...') 
       через JS — как показано выше.
  -->
</body>
</html>
